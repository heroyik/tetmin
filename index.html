<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tetris Minimal</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --game-bg: #050505;
            --accent-color: #ff0055;
            --text-color: #ffffff;
            --btn-bg: rgba(255, 255, 255, 0.08);
            --btn-active: rgba(255, 255, 255, 0.15);
            --btn-border: rgba(255, 255, 255, 0.12);
            --btn-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --border-color: #222;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Main Layout */
        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100dvh; /* Dynamic Viewport Height */
            max-width: 600px; /* Limit max width for PC */
            margin: 0 auto;
            position: relative;
        }

        /* Header / Stats Area */
        #header {
            display: none; /* Hide header as buttons are moved */
        }

        .side-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            margin-left: 10px;
        }

        .board-stats {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 5;
        }

        .stat-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .board-stats .stat-group {
            background: rgba(0,0,0,0.15);
            padding: 4px 10px;
            border-radius: 12px;
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stats-right {
            display: flex;
            gap: 10px;
        }

        .stat-label { font-size: 9px; color: #888; letter-spacing: 1px; margin-bottom: 2px; text-transform: uppercase; }
        .stat-value { font-size: 16px; font-weight: bold; color: var(--text-color); }
        .stat-group.horizontal { flex-direction: row; gap: 10px; }

        /* Game Area */
        #game-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 10px;
            /* Extra room for side controls on the right */
            padding-right: 70px; 
            padding-left: 70px; /* Balance for centering board */
        }

        #game-board {
            position: relative;
            border: 2px solid var(--border-color);
            background-color: var(--game-bg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            /* Aspect ratio maintenance via JS or max-height */
            height: 100%;
            aspect-ratio: 12 / 20; 
            max-height: 58vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Overlays */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #overlay h1 { margin: 0 0 10px 0; font-size: 2rem; color: var(--accent-color); font-weight: 800; }
        #overlay p { margin-bottom: 20px; color: #aaa; font-weight: 500; }
        .blink { 
            animation: blink 1.5s infinite; 
            font-weight: bold; 
            padding: 12px 24px; 
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 24px;
            color: var(--text-color);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            box-shadow: var(--btn-shadow);
            cursor: pointer;
            transition: all 0.2s;
        }
        .blink:active {
            transform: scale(0.95);
            background: var(--btn-active);
        }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* Controls Area - Restored Grid Layout */
        #controls-area {
            height: auto;
            min-height: 160px;
            padding: 0 20px 80px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -10px;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px; /* Spacing between buttons */
            width: 100%;
            max-width: 320px; /* Limit width */
        }

        /* Consistent Button Styles */
        .btn, .util-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            box-shadow: var(--btn-shadow);
        }

        .btn:active, .util-btn:active {
            background: var(--btn-active);
            transform: scale(0.92);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        /* Control Buttons (Circular) */
        .btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            font-size: 28px;
            margin: 0 auto;
        }

        /* Utility Buttons (Squircle/Rounded Rect) */
        .util-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            font-size: 20px;
            padding: 0;
            min-width: 44px;
        }

        .util-group {
            display: flex;
            gap: 10px;
        }

        /* Specific Control Colors (Subtle Accents) */
        .btn-hard { color: #ff3c28; border-color: rgba(255, 60, 40, 0.3); }
        .btn-rotate { color: #283cff; border-color: rgba(40, 60, 255, 0.3); }

        /* ... (rest of style) ... */

        /* Mobile Controls (Bottom) */
    </style>
</head>
<body>

    <div id="app">
        <!-- Game Area -->
        <div id="game-area">
            <div id="game-board">
                <div class="board-stats">
                    <div class="stat-group">
                        <span class="stat-label">NEXT</span>
                        <canvas id="next-piece" width="60" height="60"></canvas>
                    </div>
                    <div class="stats-right">
                        <div class="stat-group">
                            <span class="stat-label">LEVEL</span>
                            <span class="stat-value" id="level">1</span>
                        </div>
                        <div class="stat-group">
                            <span class="stat-label">SCORE</span>
                            <span class="stat-value" id="score">0</span>
                        </div>
                    </div>
                </div>
                
                <canvas id="tetris" width="240" height="400"></canvas>
                
                <div id="overlay">
                    <h1>TETRIS</h1>
                    <p>민비서의 콧노래 ♪</p>
                    <div class="blink">TAP TO START</div>
                </div>
            </div>

            <div class="side-controls">
                <button id="stop-btn" class="util-btn">⏹️</button>
                <button id="pause-btn" class="util-btn">⏸️</button>
                <button id="mute-btn" class="util-btn">🔊</button>
            </div>
        </div>

        <!-- Header removed -->

        <!-- Mobile Controls (Restored Grid Layout) -->
        <div id="controls-area">
            <div id="controls">
                <!-- Row 1 -->
                <div></div> <!-- Empty top-left -->
                <div class="btn btn-hard" id="btn-hard">⏬</div>
                <div class="btn btn-rotate" id="btn-rotate">↻</div>
                
                <!-- Row 2 -->
                <div class="btn btn-left" id="btn-left">←</div>
                <div class="btn btn-down" id="btn-down">↓</div>
                <div class="btn btn-right" id="btn-right">→</div>
            </div>
        </div>
    </div>

    <audio id="bgm" src="https://ia800504.us.archive.org/33/items/TetrisThemeMusic/Tetris.mp3" loop></audio>

    <script>
        // --- Game Constants & State ---
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-piece');
        const nextContext = nextCanvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const overlay = document.getElementById('overlay');
        const bgm = document.getElementById('bgm');
        const pauseBtn = document.getElementById('pause-btn');
        const stopBtn = document.getElementById('stop-btn');
        const muteBtn = document.getElementById('mute-btn');

        context.scale(20, 20);
        nextContext.scale(15, 15);

        const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
        const arena = createMatrix(12, 20);
        const player = { pos: {x: 0, y: 0}, matrix: null, next: null, score: 0, level: 1, lines: 0 };

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isGameOver = false;
        let isPaused = false;
        let isMuted = false;
        let animationId = null;

        // --- Audio Engine (Simplified) ---
        const AudioEngine = {
            ctx: null,
            init: function() {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            },
            play: function(type, freq, dur, vol=0.1) {
                if(isMuted || !this.ctx) return;
                const o = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                o.type = type; o.frequency.value = freq;
                g.gain.setValueAtTime(vol, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                o.connect(g); g.connect(this.ctx.destination);
                o.start(); o.stop(this.ctx.currentTime + dur);
            },
            move: () => AudioEngine.play('square', 220, 0.05),
            rotate: () => AudioEngine.play('square', 440, 0.08),
            drop: () => AudioEngine.play('sawtooth', 150, 0.15),
            clear: () => AudioEngine.play('square', 880, 0.1),
            gameover: () => AudioEngine.play('sawtooth', 100, 1.0),
            levelUp: () => {
                [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => AudioEngine.play('triangle', f, 0.2), i*100));
            }
        };

        bgm.volume = 0.5;

        // --- Core Logic ---
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function createPiece(type) {
            if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
            if (type === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
            if (type === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
            if (type === 'O') return [[4, 4], [4, 4]];
            if (type === 'Z') return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
            if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            if (type === 'T') return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
        }

        function drawMatrix(matrix, offset, ctx = context, ghost = false) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        // Clean flat style
                        ctx.fillStyle = ghost ? 'rgba(255,255,255,0.2)' : colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // Minimal border
                        if (!ghost) {
                            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                            ctx.lineWidth = 0.05;
                            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                        }
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#111'; // Explicit clear color
            context.fillRect(0, 0, canvas.width, canvas.height);
            
            drawMatrix(arena, {x: 0, y: 0});
            
            if (!isGameOver && !isPaused && player.matrix) {
                // Ghost
                const ghost = { pos: {...player.pos}, matrix: player.matrix };
                while (!collide(arena, ghost)) ghost.pos.y++;
                ghost.pos.y--;
                drawMatrix(ghost.matrix, ghost.pos, context, true);
                
                // Player
                drawMatrix(player.matrix, player.pos);
            }
        }

        function drawNext() {
            nextContext.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (player.next) {
                const ox = (4 - player.next[0].length) / 2;
                const oy = (4 - player.next.length) / 2;
                drawMatrix(player.next, {x: ox, y: oy}, nextContext);
            }
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            let cleared = 0;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 100;
                player.lines++;
                rowCount *= 2;
                cleared++;
            }
            if (cleared > 0) {
                AudioEngine.clear();
                updateScore();
            }
        }

        function updateScore() {
            scoreEl.innerText = player.score;
            const newLevel = Math.floor(player.lines / 10) + 1;
            if (newLevel > player.level) {
                player.level = newLevel;
                AudioEngine.levelUp();
                showToast();
            }
            levelEl.innerText = player.level;
            dropInterval = Math.max(100, 1000 - (player.level - 1) * 100); 
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            if (player.next === null) player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.matrix = player.next;
            player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                isGameOver = true;
                AudioEngine.gameover();
                bgm.pause();
                bgm.currentTime = 0;
                overlay.style.display = 'flex';
                overlay.querySelector('h1').innerText = "GAME OVER";
                overlay.querySelector('p').innerText = "SCORE: " + player.score;
                overlay.querySelector('.blink').innerText = "RESTART";
            } else {
                drawNext();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
            else AudioEngine.move();
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
            AudioEngine.rotate();
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function update(time = 0) {
            if (isGameOver || isPaused) return;
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            draw();
            animationId = requestAnimationFrame(update);
        }

        function startGame() {
            if (isPaused) { togglePause(); return; }
            
            tryPlayAudio();
            if (!AudioEngine.ctx) AudioEngine.init();

            if (isGameOver) {
                arena.forEach(row => row.fill(0));
                player.score = 0; player.lines = 0; player.level = 1; player.next = null;
                updateScore();
                isGameOver = false;
            }
            if (!player.matrix) playerReset();
            
            overlay.style.display = 'none';
            playerReset(); // Start fresh piece
            if(animationId) cancelAnimationFrame(animationId);
            update();
            bgm.play().catch(()=>{});
        }

        // --- Interaction ---
        function tryPlayAudio() {
            if (AudioEngine.ctx && AudioEngine.ctx.state === 'suspended') AudioEngine.ctx.resume();
        }

        function togglePause() {
             if (isGameOver) return;
             isPaused = !isPaused;
             if (isPaused) {
                 bgm.pause();
                 overlay.style.display = 'flex';
                 overlay.querySelector('h1').innerText = "PAUSED";
                 overlay.querySelector('p').innerText = "Game Paused";
                 overlay.querySelector('.blink').innerText = "RESUME";
                 cancelAnimationFrame(animationId);
             } else {
                 if(!isMuted) bgm.play();
                 overlay.style.display = 'none';
                 update();
             }
        }

        function stopGame() {
            if (isGameOver && overlay.style.display === 'flex') return;
            isGameOver = true;
            isPaused = false;
            bgm.pause();
            bgm.currentTime = 0;
            cancelAnimationFrame(animationId);
            pauseBtn.innerText = "⏸️"; // Reset pause button state
            
            overlay.style.display = 'flex';
            overlay.querySelector('h1').innerText = "TETRIS";
            overlay.querySelector('p').innerText = "Press Start";
            overlay.querySelector('.blink').innerText = "TAP TO START";
        }

        function showToast() {
            // Toast functionality removed
        }

        // Event Listeners
        document.addEventListener('keydown', event => {
            if (isGameOver || isPaused) {
                 if(event.key === 'p' || event.key === 'P') togglePause();
                 return;
            }
            if (event.keyCode === 37) playerMove(-1);
            else if (event.keyCode === 39) playerMove(1);
            else if (event.keyCode === 40) playerDrop();
            else if (event.keyCode === 81 || event.keyCode === 38) playerRotate(1);
            else if (event.keyCode === 32) { 
                AudioEngine.drop();
                while (!collide(arena, player)) player.pos.y++;
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                dropCounter = 0;
            }
        });

        overlay.addEventListener('click', startGame);
        overlay.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); }, {passive: false});

        stopBtn.addEventListener('click', (e) => { e.target.blur(); stopGame(); });
        pauseBtn.addEventListener('click', (e) => { e.target.blur(); togglePause(); });
        muteBtn.addEventListener('click', (e) => {
            e.target.blur();
            isMuted = !isMuted;
            muteBtn.innerText = isMuted ? "🔇" : "🔊";
            if(isMuted) bgm.pause(); else if(!isPaused) bgm.play();
        });

        // Touch Controls
        const addTouch = (id, cb) => {
            const btn = document.getElementById(id);
            if(!btn) return; // For Desktop where btns might be hidden
            // Prevent default to stop double-tap zoom etc
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if(!isGameOver && !isPaused) {
                    cb();
                    tryPlayAudio();
                }
            }, {passive: false});
            // Mouse for testing
            btn.addEventListener('mousedown', (e) => {
                if(!isGameOver && !isPaused) cb();
            });
        };

        addTouch('btn-left', () => playerMove(-1));
        addTouch('btn-right', () => playerMove(1));
        addTouch('btn-down', () => playerDrop());
        addTouch('btn-rotate', () => playerRotate(1));
        addTouch('btn-hard', () => {
             AudioEngine.drop();
             while (!collide(arena, player)) player.pos.y++;
             player.pos.y--;
             merge(arena, player);
             playerReset();
             arenaSweep();
             dropCounter = 0;
        });

    </script>
</body>
</html>
